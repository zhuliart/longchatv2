# 本地开发数据库（T0.4）
# 用法：docker compose -f deploy/docker-compose.dev.yml up -d
# 连接串（server/.env.example 已预置）：
#   mongodb://pingchang:pingchang_dev@localhost:27017/pingchang?authSource=admin
services:
  mongo:
    image: mongo:6
    container_name: pingchang-mongo-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: pingchang
      MONGO_INITDB_ROOT_PASSWORD: pingchang_dev
      MONGO_INITDB_DATABASE: pingchang
    volumes:
      - mongo-dev-data:/data/db

volumes:
  mongo-dev-data: {}
