# 生产 nginx（M8）：托管前端 SPA + 反代后端 /api。先跑 HTTP，绑域名后再加 443。
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1m;            # 信件/日记为文本，1MB 足够

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

  # 后端 API 反代（透传真实 IP，供登录限速用）
  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 带指纹的静态资源（含自托管字体）长缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA 前端路由：找不到文件回落 index.html
  location / {
    try_files $uri /index.html;
  }

  # index.html 不缓存，保证发新版即时生效
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
